[alembic]
script_location = migrations
# Lets migrations/env.py import the oddstudio package when alembic runs as a console script (the container).
prepend_sys_path = .
# The database URL comes from DATABASE_URL (see migrations/env.py); never put credentials here.

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
