# Public HTTPS access (owner-approved 2026-11-17): adds a Caddy reverse proxy in front of the dashboard; the one
# exception is the media upload route, which Caddy passes straight to the API (see Caddyfile).
# deploy.sh includes this file when /srv/stickman/shared/.env sets PUBLIC_HOST. Without it the stack stays
# tunnel-only (dashboard on 127.0.0.1:3000).
# Note: Docker-published ports bypass ufw, so publish nothing else here.
services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [web, api]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      PUBLIC_PORT: ${PUBLIC_PORT:-8443}
    ports:
      - "80:80"
      - "${PUBLIC_PORT:-8443}:${PUBLIC_PORT:-8443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128m}

volumes:
  caddy_data:
  caddy_config:
