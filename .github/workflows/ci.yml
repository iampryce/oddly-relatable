name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: studio-app/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: studio-app/api/requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit and workflow tests
        run: python -m unittest discover -s tests -v
      - name: Backup, restore and housekeeping scripts (simulation)
        working-directory: .
        run: bash studio-app/deploy/tests/simulate-backups.sh
      - name: Deploy with the HTTPS proxy checks (simulation)
        working-directory: .
        run: bash studio-app/deploy/tests/simulate-deploy.sh

  renderer:
    name: Renderer unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Banner layout (no canvas needed)
        run: node --test production/animation/*.test.mjs

  web:
    name: Web typecheck and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: studio-app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-app/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
